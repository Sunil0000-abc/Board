services:
  backend1:
    build: ./backend
    env_file: /home/ubuntu/Board/backend/.env
    networks:
      - app-network

  backend2:                    # ← was backend1
    build: ./backend
    env_file: /home/ubuntu/Board/backend/.env
    networks:
      - app-network

  backend3:                    # ← was backend1
    build: ./backend
    env_file: /home/ubuntu/Board/backend/.env
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"            # ← was missing - and []
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.config:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-network

networks:                      # ← was inside services (wrong indentation)
  app-network:
    driver: bridge